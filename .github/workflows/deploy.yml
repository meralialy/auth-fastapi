name: Deploy Worker

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Install Ruff
        run: uv pip install --system ruff

      - name: Run Ruff Lint
        run: ruff check src/

  format:
    runs-on: ubuntu-latest
    name: Formatting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Install Ruff
        run: uv pip install --system ruff

      - name: Run Ruff Format Check
        run: ruff format --check src/

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: [lint, format]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Build Project
        run: uvx --from workers-py pywrangler build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uvx --from workers-py pywrangler deploy


